name: Deploy to server LightSail TurnoFarm

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy using ssh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          key_type: pem
          port: 22
          script: |
            set -e
            cd /home/bitnami/paginas/farmachile-web
            git pull origin main
            # El proyecto usa pnpm y Vite (requiere Node >= 20.19); el build
            # sigue saliendo en build/ para que el servidor no cambie.
            command -v pnpm >/dev/null 2>&1 || npm install -g pnpm@9
            pnpm install --frozen-lockfile
            pnpm build
